name: 网上国网（Hark 液态玻璃 · 每日电费推送版）
description: |
  # 国家电网电费余额、昨日/本月/上月用电、近 30 日与月度柱状图（小/中/大号与锁屏）
  # 支持自定义精确到「时:分」的每日电费通知推送与多户号低余额独立预警
  # 内置全国 31 省阶梯电价与分界（支持年/月/双月/季节阶梯），按户号归属省自动切换并在标题栏显示当前阶梯单价
  # 直连网上国网 App 接口，不经第三方网关；电价数据核对截至 2026-11-11（源自 95598 及各省发改委）
author: Hark & ddsy2001（版式参考 jadkg；电价表参考 idodo777；App 协议移植自 stevenjoezhang/hass-state-grid，MIT）
icon: https://is1-ssl.mzstatic.com/image/thumb/Purple116/v4/83/d8/8a/83d88a92-5a4d-7a2f-118c-80d795e7a9f6/AppIcon-0-0-1x_U007emarketing-0-5-0-0-sRGB-85-220.png/144x144.png
compat_arguments:
  NOTIFY_CRON: '* * * * *'
env_schema:
  SGCC_USERNAME:
    name: 网上国网账号
    description: 登录网上国网 App 的手机号
    default_value: ''
  SGCC_PASSWORD:
    name: 网上国网密码
    description: 网上国网 App 的登录密码（没设过密码的先在 App 里设置一个）
    default_value: ''
  SGCC_SMS:
    name: 短信验证码
    description: 首次登录国网可能要求验证新设备，小组件提示后把收到的 6 位验证码填这里保存，再刷新小组件
    default_value: ''
  SGCC_ACCOUNT:
    name: 户号（可选）
    description: 多个户号时填要显示的户号或尾号，也可填 #2 表示第 2 个；留空显示第一个。想不同小组件显示不同户号，在各自小组件的环境变量里填
    default_value: ''
  SGCC_REGION:
    name: 所在省份
    description: 默认「自动」会按户号归属省自动切换当地阶梯电价与分界（含年/月/双月及季节阶梯）；识别不准时也可手动选择省份
    default_value: 自动
    options:
      - 自动
      - 湖北
      - 北京
      - 浙江
      - 江苏
      - 上海
      - 广东
      - 山东
      - 四川
      - 河南
      - 河北
      - 湖南
      - 安徽
      - 福建
      - 天津
      - 重庆
      - 陕西
      - 江西
      - 辽宁
      - 山西
      - 广西
      - 黑龙江
      - 吉林
      - 云南
      - 贵州
      - 内蒙古
      - 甘肃
      - 海南
      - 宁夏
      - 青海
      - 新疆
      - 西藏
  SGCC_NOTIFY_ENABLED:
    name: 每日电费通知
    description: 开启后每天在设定的「每日通知时间」推送剩余电费、预计可用天数及昨日用电量与电费
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  SGCC_NOTIFY_TIME:
    name: 每日通知时间（时:分）
    description: 每天推送电费通知的时间，精确到分（24 小时制 HH:MM，如 08:00、08:30、20:15；支持填多个时间用逗号分隔）
    default_value: '08:00'
  SGCC_LOW_BALANCE:
    name: 低余额提醒阈值（元）
    description: 当电费余额低于该金额（或欠费）时触发低余额提醒，默认 20 元；填 0 关闭低余额提醒
    default_value: '20'
  SGCC_LOW_NOTIFY_MAX:
    name: 低余额每日提醒次数上限
    description: 电费低于阈值时，每天最多提醒几次（默认每天最多 1 次，选 0 则关闭低余额提醒）
    default_value: '1'
    options:
      - '0'
      - '1'
      - '2'
      - '3'
      - '5'
  SGCC_PRICE:
    name: 电价单价（元/度，可选）
    description: 留空则自动按所在省份当前阶梯电价或近期账单均价计算；峰谷电或合表户可手动填均价覆盖
    default_value: ''
  SGCC_TIERS:
    name: 阶梯分界（可选）
    description: 留空则按所在省份标准自动切换，一般无需填写；仅当地政策特殊时手动填两个分界度数（逗号分隔）
    default_value: ''
  SGCC_POLICY:
    name: 国网请求策略
    description: 国网接口默认直连；直连不通再填国内节点或策略组名
    default_value: DIRECT
  SGCC_REFRESH:
    name: 刷新间隔（小时）
    description: 电量数据每天更新一次，间隔太短容易触发风控
    default_value: '6'
    options:
      - '1'
      - '3'
      - '6'
      - '12'
      - '24'
scriptings:
- generic:
    name: sgcc-hark
    script_url: https://raw.githubusercontent.com/ddsy2001/Hark/main/sgcc-hark.js?v=20261113-0115
    update_interval: 86400
    timeout: 60
- schedule:
    name: 网上国网定时更新
    cron: '17 */6 * * *'
    script_url: https://raw.githubusercontent.com/ddsy2001/Hark/main/sgcc-hark.js?v=20261113-0115
    update_interval: 86400
    timeout: 60
    env:
      SGCC_SCHEDULE: 'true'
- schedule:
    name: 网上国网每日电费通知
    cron: '{{{NOTIFY_CRON}}}'
    script_url: https://raw.githubusercontent.com/ddsy2001/Hark/main/sgcc-hark.js?v=20261113-0115
    update_interval: 86400
    timeout: 60
    env:
      SGCC_NOTIFY_TASK: 'true'
widgets:
- name: sgcc-hark
  script_name: sgcc-hark
