name: 网络诊断（Hark 液态玻璃版）
description: 直连/所选出口、HTTP 延迟、流媒体与 AI 站点可访问性；分段圆环 + 玻璃卡片，支持小/中/大号与锁屏
env_schema:
  POLICY:
    name: 代理策略
    description: 填 Egern 里的策略组名称（如 cocoduck）。出口、延迟、所有站点都走它；留空按分流规则
    default_value: ''
  SERVICES:
    name: 检测站点
    description: 推荐＝Netflix/YouTube/ChatGPT/Claude/Gemini/Perplexity；大号始终检测全部 12 个
    default_value: 推荐
    options:
      - 推荐
      - 流媒体
      - AI
      - 全部
  SERVICES_CUSTOM:
    name: 自定义站点（可选）
    description: 填了就覆盖上面的选择，空格或逗号分隔：netflix youtube disney spotify tiktok prime chatgpt claude gemini deepseek grok perplexity
    default_value: ''
  YS:
    name: 隐藏 IP
    description: 打开时隐藏 IP、网络名和 DNS 地址
    default_value: 'true'
    options:
      - 'true'
      - 'false'
  TIMEOUT:
    name: 超时
    description: 单次请求超时（毫秒），网络慢就调大
    default_value: '4500'
    options:
      - '3000'
      - '4500'
      - '6000'
      - '8000'
  LMT:
    name: 流媒体策略（进阶）
    description: 只在上面「代理策略」留空时生效，给 Netflix/YouTube 等单独指定策略
    default_value: ''
  AI:
    name: AI 策略（进阶）
    description: 只在「代理策略」留空时生效，给 ChatGPT/Claude 等单独指定策略
    default_value: ''
  PROXYCHECK_KEY:
    name: 纯净度 Key（可选）
    description: 不填也能用（每天 100 次，同一 IP 缓存 6 小时）；proxycheck.io 免费注册的 Key 可到每天 1000 次
    default_value: ''
scriptings:
- generic:
    name: 网络诊断-Hark
    script_url: https://raw.githubusercontent.com/zhaohantao1360-hash/Hark/main/network-radar-hark.js?v=20261011-2216
    timeout: 30
widgets:
- name: 网络诊断-Hark
  script_name: 网络诊断-Hark
